<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Sable · Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;540;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css"/>
<style>
  html, body { margin: 0; padding: 0; background: #0B0C10; color: #ECEDF1; }
  body { font-family: var(--font-ui); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  * { box-sizing: border-box; }
  /* Inter 540 is uncommon in browser font menus — fall back to 500 weight axis */
  @supports not (font-weight: 540) { :root { --fw-m: 500; } }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="tokens-cards.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens-a.jsx"></script>
<script type="text/babel" src="screens-b.jsx"></script>
<script type="text/babel" src="extras.jsx"></script>

<script type="text/babel">
function App() {
  const T = window.STokens;
  const C = window.SComp;
  const S1 = window.SScreens1;
  const S2 = window.SScreens2;
  const X = window.SExtras;
  return (
    <DesignCanvas>

      {/* ── 0. Brief ──────────────────────────────────────────────── */}
      <DCSection id="brief" title="Sable · v0.1 → premium" subtitle="Design tokens, icon set, components, five hero screens.">
        <DCArtboard id="brand" label="A · Brand & wordmark" width={420} height={520}>
          <T.BrandWordmark/>
        </DCArtboard>
        <DCArtboard id="cover" label="B · System at a glance" width={760} height={520}>
          <CoverCard/>
        </DCArtboard>
      </DCSection>

      {/* ── 1. Tokens ─────────────────────────────────────────────── */}
      <DCSection id="tokens" title="01 · Design tokens" subtitle="Color · type · spacing · radius · elevation · motion.">
        <DCArtboard id="ink"     label="Ink scale & text"           width={420} height={620}><T.ColorNeutrals/></DCArtboard>
        <DCArtboard id="accent"  label="Space accents · 6-rotation" width={420} height={620}><T.ColorAccents/></DCArtboard>
        <DCArtboard id="type"    label="Type ramp · Inter"          width={420} height={620}><T.TypeRamp/></DCArtboard>
        <DCArtboard id="space"   label="Spacing · radius · density" width={420} height={620}><T.SpacingRadius/></DCArtboard>
        <DCArtboard id="motion"  label="Elevation & motion"         width={420} height={620}><T.ElevationMotion/></DCArtboard>
      </DCSection>

      {/* ── 2. Iconography ────────────────────────────────────────── */}
      <DCSection id="icons" title="02 · Iconography" subtitle="Custom 24px-grid · 1.5px stroke · matched to Inter regular.">
        <DCArtboard id="catalog" label="Icon catalog" width={520} height={620}><C.IconCatalog/></DCArtboard>
      </DCSection>

      {/* ── 3. Components ─────────────────────────────────────────── */}
      <DCSection id="comp" title="03 · Components" subtitle="Hover · focus · pressed · disabled · loading · error.">
        <DCArtboard id="buttons" label="Buttons"                width={620} height={520}><C.ButtonsCard/></DCArtboard>
        <DCArtboard id="inputs"  label="Inputs · omnibar"       width={520} height={520}><C.InputsCard/></DCArtboard>
        <DCArtboard id="tabs"    label="Tab row · 7 states"     width={420} height={520}><C.TabsCard/></DCArtboard>
        <DCArtboard id="chips"   label="Citation chips"         width={460} height={520}><C.ChipsCard/></DCArtboard>
        <DCArtboard id="bubbles" label="Message bubbles"        width={460} height={620}><C.BubblesCard/></DCArtboard>
        <DCArtboard id="overlay" label="Drop overlay · splitter · dropdown" width={520} height={620}><C.OverlaysCard/></DCArtboard>
      </DCSection>

      {/* ── 4. Hero screens ───────────────────────────────────────── */}
      <DCSection id="hero" title="04 · Hero screens" subtitle="1280 × 820 · default window. Each Space gets its own accent.">
        <DCArtboard id="sidebar"  label="① Sidebar · vertical tabs · chat · omnibar"  width={1280} height={820}><S1.HeroSidebar/></DCArtboard>
        <DCArtboard id="chat"     label="② Chat composer · bubbles · citations"       width={1280} height={820}><S1.HeroChat/></DCArtboard>
        <DCArtboard id="splits"   label="③ Pane area · splits · drop overlay"         width={1280} height={820}><S1.HeroSplits/></DCArtboard>
        <DCArtboard id="settings" label="④ Settings · BYOK · local model"             width={1280} height={820}><S2.HeroSettings/></DCArtboard>
        <DCArtboard id="switcher" label="⑤ Titlebar · space switcher"                 width={1280} height={820}><S2.HeroSwitcher/></DCArtboard>
      </DCSection>

      {/* ── 5. Compact ────────────────────────────────────────────── */}
      <DCSection id="compact" title="05 · Compact window" subtitle="720 × 600 · minimum supported size. Tighter density holds.">
        <DCArtboard id="compact-min" label="Min window" width={720} height={600}><S2.HeroCompact/></DCArtboard>
      </DCSection>

      {/* ── 6. Handoff ────────────────────────────────────────────── */}
      <DCSection id="handoff" title="06 · Handoff" subtitle="Tailwind config snippet · resolved questions.">
        <DCArtboard id="tw"   label="tailwind.config.ts" width={520} height={680}><X.TailwindSnippet/></DCArtboard>
        <DCArtboard id="open" label="Open questions"     width={520} height={680}><X.OpenQuestions/></DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

function CoverCard() {
  const sw = (a) => ({
    width: 38, height: 38, borderRadius: 8, background: `var(--acc-${a})`,
  });
  return (
    <div style={{
      width: '100%', height: '100%', background: 'var(--ink-1)', color: 'var(--text-1)',
      fontFamily: 'var(--font-ui)', padding: 'var(--s-8)', boxSizing: 'border-box',
      display: 'flex', flexDirection: 'column', gap: 18, overflow: 'hidden',
    }}>
      <div style={{ fontSize: 11, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--text-3)', fontWeight: 540 }}>System at a glance</div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
        {/* col 1: type */}
        <div style={{ background: 'var(--ink-3)', borderRadius: 'var(--r-3)', padding: 16, border: '1px solid var(--line)' }}>
          <div style={{ fontSize: 36, fontWeight: 540, letterSpacing: '-0.03em', color: 'var(--text-1)', lineHeight: 1 }}>Inter</div>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--text-3)', marginTop: 6 }}>UI · 400 · 540</div>
          <div style={{ height: 1, background: 'var(--line)', margin: '14px 0' }}/>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: 22, fontWeight: 500, color: 'var(--text-1)' }}>JetBrains Mono</div>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--text-3)', marginTop: 6 }}>URLs · code · meta</div>
        </div>
        {/* col 2: accent rotation */}
        <div style={{ background: 'var(--ink-3)', borderRadius: 'var(--r-3)', padding: 16, border: '1px solid var(--line)' }}>
          <div style={{ fontSize: 11, color: 'var(--text-3)', marginBottom: 10, letterSpacing: '0.08em', textTransform: 'uppercase', fontWeight: 540 }}>Space accents</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 10 }}>
            {['periwinkle','mint','honey','rose','iris','coral'].map((a) => (
              <div key={a} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
                <div style={sw(a)}/>
                <span style={{ fontSize: 10, fontFamily: 'var(--font-mono)', color: 'var(--text-3)' }}>{a}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
      {/* density row */}
      <div style={{ background: 'var(--ink-3)', borderRadius: 'var(--r-3)', padding: 16, border: '1px solid var(--line)' }}>
        <div style={{ fontSize: 11, color: 'var(--text-3)', marginBottom: 12, letterSpacing: '0.08em', textTransform: 'uppercase', fontWeight: 540 }}>Density · Linear-tight</div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center', fontSize: 12, color: 'var(--text-2)', fontFamily: 'var(--font-mono)' }}>
          <span style={{ background: 'var(--ink-1)', padding: '4px 8px', borderRadius: 4 }}>tab&nbsp;28</span>
          <span style={{ background: 'var(--ink-1)', padding: '4px 8px', borderRadius: 4 }}>btn&nbsp;28</span>
          <span style={{ background: 'var(--ink-1)', padding: '4px 8px', borderRadius: 4 }}>input&nbsp;32</span>
          <span style={{ background: 'var(--ink-1)', padding: '4px 8px', borderRadius: 4 }}>row&nbsp;30</span>
          <span style={{ background: 'var(--ink-1)', padding: '4px 8px', borderRadius: 4 }}>setting&nbsp;44</span>
          <span style={{ flex: 1 }}/>
          <span style={{ color: 'var(--text-4)' }}>4-base spacing</span>
        </div>
      </div>
      {/* principles */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 10, fontSize: 11, color: 'var(--text-2)', flex: 1 }}>
        <Principle k="No skeumorph" v="Flat surfaces. Hairlines, not borders. Subtle gradients on hover only."/>
        <Principle k="Motion economy" v="80–240ms. Sharp out, soft in. No springs. The system reacts cleanly."/>
        <Principle k="Color as wayfinding" v="Six Spaces, six accents. Tinting earns its keep — neutrals do most work."/>
      </div>
    </div>
  );
}

function Principle({ k, v }) {
  return (
    <div style={{ background: 'var(--ink-2)', borderRadius: 'var(--r-2)', padding: 12, border: '1px solid var(--line-soft)' }}>
      <div style={{ fontSize: 12, fontWeight: 540, color: 'var(--text-1)', marginBottom: 4 }}>{k}</div>
      <div style={{ color: 'var(--text-3)', lineHeight: 1.5, fontSize: 11 }}>{v}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
