<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Sable · browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --bg:#F4F1EC;--surface-1:#FBFAF7;--surface-2:#FFFFFF;--surface-3:#F0EDE7;--surface-4:#E6E2DA;
  --line:rgba(20,16,8,.07);--line-strong:rgba(20,16,8,.12);
  --ink-0:#15120D;--ink-1:#3F3A30;--ink-2:#6E6759;--ink-3:#9C9381;--ink-4:#BAB1A0;
  --p-coral:#FFB89E;--p-peach:#FFD49B;--p-butter:#FFE69A;--p-mint:#B3E5C9;--p-sky:#B5D4F2;--p-lavender:#C9BEEE;--p-rose:#F2BCD0;
  --acc:var(--p-lavender);--acc-ink:#4938A8;--acc-soft:#EAE3FB;--acc-glow:rgba(155,128,240,.28);
  --ok:#2E8856;--bad:#C1442D;
  --shadow-1:0 1px 2px rgba(20,16,8,.04),0 1px 1px rgba(20,16,8,.03);
  --shadow-2:0 8px 24px rgba(20,16,8,.06),0 2px 6px rgba(20,16,8,.04);
  --shadow-3:0 24px 60px rgba(20,16,8,.12),0 4px 14px rgba(20,16,8,.08);
  --page-tint:var(--surface-1);--grain:.35;
}
[data-theme="dark"]{
  --bg:#131110;--surface-1:#1B1917;--surface-2:#232120;--surface-3:#2A2826;--surface-4:#34312E;
  --line:rgba(255,245,225,.07);--line-strong:rgba(255,245,225,.13);
  --ink-0:#F2EEE6;--ink-1:#C9C3B6;--ink-2:#948D7E;--ink-3:#6B6557;--ink-4:#4A4538;
  --p-coral:#E9967D;--p-peach:#E5BB7C;--p-butter:#E9CD7B;--p-mint:#8BC9A8;--p-sky:#8FB7DA;--p-lavender:#B0A4DC;--p-rose:#D8A0B7;
  --acc:var(--p-lavender);--acc-ink:#DDD2FF;--acc-soft:rgba(176,164,220,.16);--acc-glow:rgba(176,164,220,.32);
  --ok:#6FCB9B;--bad:#E8856C;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 12px 32px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.35);
  --shadow-3:0 30px 70px rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.45);
  --page-tint:var(--surface-1);--grain:.55;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#0a0908;color:var(--ink-0);min-height:100vh;
  font-family:'Inter',system-ui,sans-serif;font-feature-settings:'cv11','ss01','ss03';
  -webkit-font-smoothing:antialiased;font-weight:400;letter-spacing:-0.005em;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-feature-settings:'liga' 0}
button{font:inherit;color:inherit}

/* === BROWSER FRAME === */
.app{
  width:1280px;height:820px;max-width:100%;max-height:100%;
  background:var(--bg);color:var(--ink-0);
  border-radius:14px;border:1px solid var(--line-strong);
  box-shadow:0 50px 140px rgba(0,0,0,.6),0 14px 40px rgba(0,0,0,.4);
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  transition:background .25s,color .25s;
}
.app::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;opacity:var(--grain);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 .12  0 0 0 0 .10  0 0 0 0 .06  0 0 0 .04 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  mix-blend-mode:multiply;
}
[data-theme="dark"] .app::before{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 .9  0 0 0 0 .85  0 0 0 0 .75  0 0 0 .035 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  mix-blend-mode:screen;
}
.app > *{position:relative;z-index:1}

/* TITLEBAR */
.titlebar{height:38px;display:flex;align-items:center;padding:0 14px 0 78px;background:var(--bg);position:relative;gap:8px;flex-shrink:0;-webkit-app-region:drag}
.traffic{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;gap:8px;-webkit-app-region:no-drag}
.traffic i{width:12px;height:12px;border-radius:50%;display:inline-block;cursor:pointer}
.traffic i:nth-child(1){background:#FF5F57}.traffic i:nth-child(2){background:#FEBC2E}.traffic i:nth-child(3){background:#28C840}

.tabrow{flex:1;display:flex;align-items:flex-end;gap:2px;height:100%;overflow-x:auto;padding-top:4px;-webkit-app-region:no-drag;scrollbar-width:none}
.tabrow::-webkit-scrollbar{display:none}
.tab{
  height:30px;display:inline-flex;align-items:center;gap:8px;padding:0 10px 0 12px;font-size:12px;color:var(--ink-1);
  border-radius:8px 8px 0 0;background:transparent;position:relative;cursor:pointer;
  max-width:200px;min-width:90px;transition:background .12s,color .12s;flex-shrink:0;
}
.tab .fav{flex-shrink:0;width:14px;height:14px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600}
.tab .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{margin-left:4px;width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);opacity:0;transition:opacity .12s,background .12s;flex-shrink:0;border:0;background:transparent;cursor:pointer}
.tab:hover .x{opacity:1}
.tab .x:hover{background:var(--surface-3);color:var(--ink-0)}
.tab:hover{background:var(--surface-3);color:var(--ink-0)}
.tab.active{background:var(--page-tint);color:var(--ink-0);font-weight:500;box-shadow:0 0 0 1px var(--line-strong);z-index:2}
.tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--page-tint)}
.tab.context{background:var(--acc-soft);color:var(--acc-ink)}
.tab.context::before{content:'@';font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:var(--acc-ink);margin-right:-2px}
.tab.dragging{opacity:.4}
.tab .fav.s-d{background:var(--p-mint);color:#0e3920}
.tab .fav.s-w{background:var(--p-sky);color:#142f4a}
.tab .fav.s-a{background:var(--p-coral);color:#4a1d0c}
.tab .fav.s-h{background:var(--p-butter);color:#4a3308}
.tab .fav.s-p{background:var(--p-rose);color:#4d1530}
.tab .fav.s-g{background:var(--ink-0);color:var(--surface-1)}
.tab .fav.s-c{background:var(--p-peach);color:#3f2509}
.tab .fav.s-l{background:var(--p-lavender);color:#211154}
.tab.loading .fav{background:transparent;border:1.5px solid var(--ink-3);border-top-color:transparent;animation:spin .8s linear infinite;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}

.tab-tools{display:inline-flex;gap:4px;margin-left:6px;padding-left:8px;border-left:1px solid var(--line);-webkit-app-region:no-drag}
.icon-btn{width:28px;height:28px;border-radius:7px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .12s}
.icon-btn:hover{background:var(--surface-3);color:var(--ink-0)}
.icon-btn svg{width:14px;height:14px}
.icon-btn.lg svg{width:16px;height:16px}.icon-btn.lg{width:30px;height:30px;border-radius:8px}

/* PAGE AREA */
.page-area{flex:1;display:flex;flex-direction:column;background:var(--page-tint);overflow:hidden;min-height:0}
.urlbar-wrap{padding:10px 12px 6px;display:flex;align-items:center;gap:10px;background:var(--page-tint);flex-shrink:0}
.urlbar{
  flex:1;height:36px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;
  border-radius:11px;background:var(--surface-2);border:1px solid var(--line);box-shadow:var(--shadow-1);
  font-size:13px;color:var(--ink-0);cursor:text;transition:all .15s;position:relative;
}
.urlbar:hover{border-color:var(--line-strong)}
.urlbar.focused{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-glow),var(--shadow-1)}
.urlbar.ai{
  background:linear-gradient(135deg,var(--surface-2),var(--surface-2)) padding-box,linear-gradient(135deg,var(--p-coral),var(--p-lavender),var(--p-sky)) border-box;
  border:1px solid transparent;box-shadow:0 0 0 5px var(--acc-glow);
}
.urlbar .lock{color:var(--ok);width:13px;height:13px;flex-shrink:0}
.urlbar .ai-glyph{width:18px;height:18px;border-radius:6px;flex-shrink:0;background:radial-gradient(circle at 30% 30%,var(--p-coral),transparent 60%),radial-gradient(circle at 70% 70%,var(--p-lavender),transparent 60%),var(--p-sky);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.urlbar .ttl{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-0);min-width:0}
.urlbar .ttl em{font-style:normal;color:var(--ink-3);font-weight:400;margin-left:6px;font-size:12px}
.urlbar input{flex:1;border:0;background:transparent;outline:0;font:inherit;color:var(--ink-0);font-size:13px;font-weight:500;min-width:0}
.urlbar input::placeholder{color:var(--ink-3);font-weight:400}
.urlbar .actions{display:flex;align-items:center;gap:2px;flex-shrink:0}
.urlbar .actions .icon-btn{width:24px;height:24px;border-radius:6px}
.urlbar .actions .icon-btn svg{width:13px;height:13px}
kbd{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-2);background:var(--surface-3);padding:2px 5px;border-radius:4px;border:1px solid var(--line)}
.right-controls{display:flex;gap:2px}
.profile-btn{width:30px;height:30px;border-radius:8px;border:0;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.profile-btn:hover{background:var(--surface-3)}
.profile-btn .glob{width:18px;height:18px;border-radius:6px;background:radial-gradient(circle at 30% 30%,var(--p-coral),transparent 60%),radial-gradient(circle at 70% 70%,var(--p-lavender),transparent 60%),var(--p-sky)}
.right-controls .pill{width:auto;padding:0 9px;height:28px;font-size:11px;font-weight:500;gap:6px;background:var(--acc-soft);color:var(--acc-ink);border-radius:8px;border:0;cursor:pointer;display:inline-flex;align-items:center}
.right-controls .pill:hover{filter:brightness(.97)}

/* AI DROPDOWN (focused urlbar) */
.ai-pop{
  position:absolute;left:0;right:0;top:calc(100% + 6px);
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-3);
  padding:6px;z-index:20;
}
.ai-pop .head{padding:8px 10px 4px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.12em;display:flex;justify-content:space-between}
.ai-pop .row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink-0)}
.ai-pop .row:hover,.ai-pop .row.sel{background:var(--surface-3)}
.ai-pop .row .ic{width:22px;height:22px;border-radius:7px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--ink-1);flex-shrink:0}
.ai-pop .row .ic.ai{background:radial-gradient(circle at 30% 30%,var(--p-coral),transparent 60%),radial-gradient(circle at 70% 70%,var(--p-lavender),transparent 60%),var(--p-sky)}
.ai-pop .row .meta{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-3)}

/* SPACES POP */
.spaces-pop{position:absolute;top:42px;left:14px;width:280px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-3);padding:6px;z-index:30;-webkit-app-region:no-drag}
.spaces-pop .head{padding:8px 10px 4px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.12em;display:flex;justify-content:space-between}
.switch-row{display:flex;align-items:center;gap:10px;padding:0 10px;height:38px;border-radius:9px;cursor:pointer}
.switch-row:hover{background:var(--surface-3)}
.switch-row.on{background:var(--acc-soft)}
.switch-row .badge{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px}
.switch-row .nm{flex:1;font-size:13px;color:var(--ink-0)}
.switch-row .ct{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-2)}
.switch-row .sc{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-3);width:24px;text-align:right;margin-left:6px}

/* SPACE GLYPH IN TITLEBAR */
.space-tag{display:inline-flex;align-items:center;gap:6px;padding:0 10px;height:24px;border-radius:7px;font-size:11px;color:var(--ink-1);cursor:pointer;-webkit-app-region:no-drag;background:transparent;border:0}
.space-tag:hover{background:var(--surface-3);color:var(--ink-0)}
.space-tag .gl{width:11px;height:11px;border-radius:4px}

/* PAGE BODY */
.page-body{flex:1;display:flex;min-height:0;overflow:hidden}
.page-content{flex:1;overflow:auto;display:flex;flex-direction:column}
.page-content::-webkit-scrollbar{width:8px;height:8px}
.page-content::-webkit-scrollbar-thumb{background:var(--surface-4);border-radius:4px}
.page-content::-webkit-scrollbar-track{background:transparent}

/* PAGE: arxiv */
.page-pad{padding:36px 44px;max-width:760px}
.crumb{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.crumb svg{width:11px;height:11px;color:var(--ok)}
.page-h{font-size:34px;font-weight:500;letter-spacing:-.025em;line-height:1.05;color:var(--ink-0);margin:0 0 4px}
.byline{color:var(--ink-2);font-size:12.5px}
.page-text{color:var(--ink-1);font-size:13.5px;line-height:1.7;margin-top:14px}
.page-text p{margin:0 0 12px}.page-text b{color:var(--ink-0);font-weight:500}
.page-text mark{background:color-mix(in oklch,var(--acc) 35%,transparent);color:var(--ink-0);padding:0 2px;border-radius:2px}
.page-text mark.selected{box-shadow:0 0 0 2px var(--acc-ink);cursor:grab}
.figure{margin:16px 0;padding:20px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);font-size:12px;color:var(--ink-2);text-align:center}
.figure .diagram{display:flex;justify-content:center;gap:6px;margin-bottom:10px}
.figure .expert{width:38px;height:50px;border-radius:7px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-2)}
.figure .expert.on{background:var(--acc-soft);color:var(--acc-ink);border:1px solid var(--acc)}

/* PAGE: NTP */
.ntp{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:24px}
.ntp-bg{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 35%,var(--p-coral),transparent 70%),radial-gradient(40% 40% at 30% 80%,var(--p-lavender),transparent 70%),radial-gradient(40% 40% at 75% 75%,var(--p-butter),transparent 70%);opacity:.55;filter:blur(20px);animation:shimmer 16s ease-in-out infinite}
[data-theme="dark"] .ntp-bg{opacity:.30}
@keyframes shimmer{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-3%,2%) scale(1.05)}66%{transform:translate(2%,-1%) scale(.97)}}
.ntp-inner{position:relative;text-align:center;width:100%;max-width:560px}
.ntp-greeting{font-size:36px;font-weight:500;letter-spacing:-.025em;line-height:1.1;color:var(--ink-0);margin:0}
.ntp-greeting .accent{color:var(--acc-ink)}
.ntp-time{font-family:'JetBrains Mono',monospace;color:var(--ink-2);font-size:11px;margin-top:8px;letter-spacing:.04em;text-transform:uppercase}
.ntp-cmd{margin-top:32px;height:54px;display:flex;align-items:center;gap:12px;padding:0 14px 0 18px;border-radius:14px;background:var(--surface-2);border:1.5px solid var(--acc);box-shadow:0 0 0 6px var(--acc-glow),var(--shadow-2);font-size:14px;color:var(--ink-0);text-align:left}
.ntp-cmd .ai-glyph{width:24px;height:24px;border-radius:8px;flex-shrink:0;background:radial-gradient(circle at 30% 30%,var(--p-coral),transparent 60%),radial-gradient(circle at 70% 70%,var(--p-lavender),transparent 60%),var(--p-sky)}
.ntp-cmd input{flex:1;border:0;background:transparent;outline:0;font:inherit;font-size:14px;color:var(--ink-0)}
.ntp-cmd input::placeholder{color:var(--ink-3)}
.ntp-suggest{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:16px}
.ntp-suggest .s{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-1);padding:5px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
.ntp-suggest .s:hover{background:var(--surface-3)}
.ntp-pinned{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:center;gap:10px}
.ntp-pin{display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;cursor:pointer}
.ntp-pin .ico{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;box-shadow:var(--shadow-1)}
.ntp-pin .lab{font-size:10px;color:var(--ink-2)}

/* PAGE: github / hf-style */
.repo-head{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.repo-head .av{width:40px;height:40px;border-radius:11px;background:var(--p-mint);color:#0e3920;display:flex;align-items:center;justify-content:center;font-weight:600}
.repo-head h3{margin:0;font-size:18px;font-weight:500;letter-spacing:-.015em}
.repo-head .meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-2);margin-top:2px}
.readme{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2)}
.readme h4{margin:0 0 8px;font-size:14px;font-weight:500}
.readme code{font-family:'JetBrains Mono',monospace;font-size:11.5px;background:var(--surface-3);padding:1px 5px;border-radius:4px}
.readme pre{margin:8px 0;padding:12px;background:var(--surface-3);border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;color:var(--ink-1);overflow-x:auto}

/* SETTINGS */
.settings-frame{display:grid;grid-template-columns:200px 1fr;flex:1;min-height:0;overflow:hidden}
.s-nav{border-right:1px solid var(--line);padding:14px 10px;background:var(--bg);display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.s-nav h6{margin:10px 10px 4px;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-family:'JetBrains Mono',monospace}
.s-nav a{display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;border-radius:8px;font-size:12.5px;color:var(--ink-1);text-decoration:none;cursor:pointer}
.s-nav a:hover{background:var(--surface-3);color:var(--ink-0)}
.s-nav a.on{background:var(--acc-soft);color:var(--acc-ink);font-weight:500}
.s-nav a svg{width:13px;height:13px}
.s-body{padding:32px 40px;overflow-y:auto;background:var(--page-tint)}
.s-h1{font-size:26px;font-weight:500;letter-spacing:-.02em;margin:0 0 4px}
.s-sub{font-size:13px;color:var(--ink-2);margin:0 0 22px;max-width:60ch;line-height:1.55}

.provider-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.prov{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;position:relative;transition:all .12s}
.prov:hover{border-color:var(--line-strong)}
.prov.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow)}
.prov .top{display:flex;align-items:center;gap:8px}
.prov .name{font-size:13px;font-weight:500;color:var(--ink-0)}
.prov.on .name::after{content:'';width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--ok);box-shadow:0 0 0 3px color-mix(in oklch,var(--ok) 22%,transparent);margin-left:6px;vertical-align:1px}
.prov .sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-2);margin-top:4px}
.prov.on .badge{position:absolute;top:10px;right:10px;font-size:9px;font-weight:500;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:color-mix(in oklch,var(--ok) 18%,transparent);color:var(--ok)}
.key-card{padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}

function $(s,r=document){return r.querySelector(s)}
function el(tag,attr={},html){const e=document.createElement(tag);Object.entries(attr).forEach(([k,v])=>{if(k==='cls')e.className=v;else if(k==='data')Object.entries(v).forEach(([dk,dv])=>e.dataset[dk]=dv);else e.setAttribute(k,v)});if(html!=null)e.innerHTML=html;return e}

function renderTabs(){
  const row=$('#tabrow');row.innerHTML='';
  TABS.forEach(t=>{
    const tab=el('div',{cls:`tab ${t.id===activeTabId?'active':''} ${t.context?'context':''} ${t.loading?'loading':''}`,draggable:'true','data-id':t.id});
    tab.innerHTML=`<div class="fav ${t.favCls}">${t.fav}</div><div class="ttl">${t.title}</div><button class="x" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="9" height="9" stroke-linecap="round"><path d="M5 5l14 14M5 19L19 5"/></svg></button>`;
    tab.onclick=e=>{ if(!e.target.closest('.x')) selectTab(t.id) };
    tab.querySelector('.x').onclick=e=>{e.stopPropagation();closeTab(t.id)};
    tab.addEventListener('dragstart',ev=>{ev.dataTransfer.setData('text/plain',t.id);tab.classList.add('dragging');setTimeout(()=>$('#dropOv').classList.add('on'),0)});
    tab.addEventListener('dragend',()=>{tab.classList.remove('dragging');$('#dropOv').classList.remove('on');document.querySelectorAll('.drop-cell').forEach(c=>c.classList.remove('hot'))});
    row.appendChild(tab);
  });
  $('#tabCount').textContent=TABS.length;
}

function renderSpace(){

  $('#spaceGl').style.background=SPACE_HEX[sp.accent][0];
  document.documentElement.style.setProperty('--acc',`var(--p-${sp.accent})`);
  // accent ink for pop matches
  const dark=document.body.dataset.theme==='dark';
  const accInkMap={rose:dark?'#F8C9DA':'#7a1840', lavender:dark?'#DDD2FF':'#4938A8', mint:dark?'#A8DCBE':'#1d5e3b', sky:dark?'#B6D6F0':'#1e4878', butter:dark?'#F0DC9A':'#6b4810', coral:dark?'#F4B198':'#7a2c14'};
  document.documentElement.style.setProperty('--acc-ink',accInkMap[sp.accent]);

  document.documentElement.style.setProperty('--acc-glow',`color-mix(in oklch, var(--p-${sp.accent}) 35%, transparent)`);
}

function renderSpacesPop(){

function selectTab(id){activeTabId=id;renderTabs();renderPage();renderUrl()}
function closeTab(id){const i=TABS.findIndex(t=>t.id===id);if(i<0)return;TABS.splice(i,1);if(activeTabId===id){activeTabId=TABS[Math.max(0,i-1)]?.id||null;if(!activeTabId)addNewTab()}renderTabs();renderPage();renderUrl()}
function addNewTab(kind='ntp'){const id='t'+Math.random().toString(36).slice(2,8);const titles={ntp:['New Tab','—']};const fav={ntp:['∗','s-l']};const [t,sub]=titles[kind]||['—','—'];const [f,fc]=fav[kind]||['?','s-d'];TABS.push({id,kind,title:t,sub,fav:f,favCls:fc,context:false,loading:false});activeTabId=id;renderTabs();renderPage();renderUrl();return id}

function openOrSelect(kind){const ex=TABS.find(t=>t.kind===kind);if(ex)return selectTab(ex.id);
  const meta={arxiv:['Mixtral of Experts','arxiv.org · 2401.04088','A','s-a'],github:['QwenLM / qwen3','github.com','G','s-g'],hf:['Qwen3-1.7B','huggingface.co','H','s-h'],wiki:['Mixture of experts','wikipedia.org','W','s-w'],settings:['Settings','sable://settings','S','s-l']}[kind]||['—','—','?','s-d'];
  const id='t'+Math.random().toString(36).slice(2,8);
  TABS.push({id,kind,title:meta[0],sub:meta[1],fav:meta[2],favCls:meta[3],context:false,loading:false});
  activeTabId=id;renderTabs();renderPage();renderUrl()}

function openAIAnswer(q){
  // simulate: convert NTP to a thinking page, push a chat msg
  msgs.push({role:'user',text:q});
  msgs.push({role:'ai',meta:'claude · sonnet 4 · routing…',text:'Mixture of experts is an architecture where ',stream:true});
  renderMsgs();
  if(!chatVisible){chatVisible=true;$('#sidebar').classList.remove('hidden')}
  setTimeout(()=>{
    msgs[msgs.length-1].text='Mixture of experts is an architecture where multiple sub-networks (experts) specialize on different parts of the input. A small router sends each token to the best <b>top-k</b> experts; the results are mixed by softmax weights. Total parameters scale with the number of experts, but per-token compute scales with k.';
    msgs[msgs.length-1].stream=false;
    msgs[msgs.length-1].cites=[{n:1,src:'Mixtral · arxiv.org'},{n:2,src:'MoE · wikipedia'}];
    renderMsgs();
  },1400);
}

function sendMessage(){
  const inp=$('#composerInput');const txt=inp.value.trim();if(!txt&&!composerStack.length)return;
  msgs.push({role:'user',text:txt||'(no text)',stack:[...composerStack]});
  composerStack=[];renderComposerStack();inp.value='';renderMsgs();
  setTimeout(()=>{msgs.push({role:'ai',meta:'claude · sonnet 4 · 480ms',text:'Looking at the cited tabs, the routing diverges most at long context — past 16k tokens, the small dense model loses needle-in-haystack accuracy faster than the sparse one.',cites:[{n:1,src:'Mixtral · arxiv.org'}]});renderMsgs()},900);
}

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._);toast._=setTimeout(()=>e.classList.remove('on'),1800)}

/* ───────── AI URL DROPDOWN ───────── */
function renderAiPop(){
  const pop=$('#aiPop');const head=$('#aiPopHead');const rows=$('#aiPopRows');
  if(!aiQuery){
    head.textContent='Recent · type to ask';
    rows.innerHTML=`
      <div class="row"><div class="ic">${ICO.history.replace('<svg','<svg width="13" height="13"')}</div>Continue: long-context evals<span class="meta">2m ago</span></div>
      <div class="row"><div class="ic">${ICO.history.replace('<svg','<svg width="13" height="13"')}</div>Compare RULER 32k results<span class="meta">12m</span></div>
      <div class="row"><div class="ic">${ICO.globe.replace('<svg','<svg width="13" height="13"')}</div>arxiv.org / 2401.04088<span class="meta">tab</span></div>
    `;
  } else {
    const looksLikeUrl=/^[\w-]+(\.[\w-]+)+/.test(aiQuery);
    const q=aiQuery;
    head.textContent='Sable will route this';
    rows.innerHTML=`
      <div class="row sel"><div class="ic ai"></div>Ask Sable: <b style="font-weight:500;margin-left:4px">${escapeHtml(q)}</b><span class="meta">↵</span></div>
      <div class="row"><div class="ic">${ICO.search.replace('<svg','<svg width="13" height="13"')}</div>Search the web for "${escapeHtml(q)}"</div>
      ${looksLikeUrl?`<div class="row"><div class="ic">${ICO.globe.replace('<svg','<svg width="13" height="13"')}</div>Go to <b style="font-weight:500">${escapeHtml(q)}</b></div>`:''}
      <div class="row"><div class="ic">${ICO.history.replace('<svg','<svg width="13" height="13"')}</div>Find in history</div>
    `;
  }
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ───────── EVENTS ───────── */
$('#urlbar').addEventListener('click',()=>{
  if(urlFocused)return;
  urlFocused=true;$('#urlbar').classList.add('focused');
  $('#urlTtl').style.display='none';$('#aiGlyph').style.display='inline-block';$('#lockIcon').style.display='none';
  $('#urlInput').style.display='inline-block';$('#urlInput').value='';$('#urlInput').focus();
  $('#aiPop').style.display='block';renderAiPop();
});
$('#urlInput').addEventListener('input',e=>{aiQuery=e.target.value;renderAiPop()});
$('#urlInput').addEventListener('keydown',e=>{
  if(e.key==='Escape')blurUrl();
  if(e.key==='Enter'&&aiQuery){const q=aiQuery;blurUrl();openAIAnswer(q)}
});
function blurUrl(){urlFocused=false;aiQuery='';$('#urlbar').classList.remove('focused');$('#urlInput').style.display='none';$('#urlInput').value='';$('#aiPop').style.display='none';$('#urlTtl').style.display='block';renderUrl()}
document.addEventListener('click',e=>{
  if(!e.target.closest('#urlbar')&&urlFocused)blurUrl();
  if(!e.target.closest('#menuPop')&&!e.target.closest('#menuBtn')&&menuOpen){menuOpen=false;$('#menuPop').style.display='none'}
  if(!e.target.closest('#spacesPop')&&!e.target.closest('#spaceBtn')&&spacesOpen){spacesOpen=false;$('#spacesPop').style.display='none'}
});

$('#newTabBtn').onclick=()=>addNewTab('ntp');
$('#chatBtn').onclick=()=>{chatVisible=!chatVisible;$('#sidebar').classList.toggle('hidden',!chatVisible)};
$('#menuBtn').onclick=e=>{e.stopPropagation();menuOpen=!menuOpen;$('#menuPop').style.display=menuOpen?'block':'none'};
$('#spaceBtn').onclick=e=>{e.stopPropagation();spacesOpen=!spacesOpen;$('#spacesPop').style.display=spacesOpen?'block':'none'};
$('#menuPop').addEventListener('click',e=>{const r=e.target.closest('.row');if(!r)return;if(r.dataset.act==='settings'){openOrSelect('settings');menuOpen=false;$('#menuPop').style.display='none'}});

$('#sendBtn').onclick=sendMessage;
$('#composerInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
$('#atBtn').onclick=()=>{
  // append a random non-already-stacked tab as @mention
  const avail=TABS.filter(t=>!composerStack.find(p=>p.name.toLowerCase()===t.title.toLowerCase().split(' ')[0]));
  const t=avail[Math.floor(Math.random()*avail.length)];if(!t)return;
  composerStack.push({fav:t.fav,cls:t.favCls,name:t.title.split(' ')[0]});renderComposerStack();
};

/* THEME */
$('#themeToggle').addEventListener('click',e=>{
  const b=e.target.closest('button[data-set]');if(!b)return;
  document.body.dataset.theme=b.dataset.set;
  document.querySelectorAll('#themeToggle button').forEach(x=>x.classList.toggle('on',x===b));
  renderSpace();
});

/* DROP OVERLAY interactions */
document.querySelectorAll('.drop-cell').forEach(c=>{
  c.addEventListener('dragenter',()=>c.classList.add('hot'));
  c.addEventListener('dragleave',()=>c.classList.remove('hot'));
  c.addEventListener('dragover',ev=>ev.preventDefault());
  c.addEventListener('drop',ev=>{ev.preventDefault();c.classList.remove('hot');toast(`Split — ${c.dataset.zone}`);$('#dropOv').classList.remove('on')});
});

/* Sidebar drop = cite */
$('#sidebar').addEventListener('dragover',ev=>{const t=ev.dataTransfer.types;if(t.includes('text/sable-quote')||t.includes('text/plain')){ev.preventDefault()}});
$('#sidebar').addEventListener('drop',ev=>{
  ev.preventDefault();
  const q=ev.dataTransfer.getData('text/sable-quote');
  const tabId=ev.dataTransfer.getData('text/plain');
  if(q){
    msgs.push({role:'user',text:`"${q.length>120?q.slice(0,120)+'…':q}"`,stack:[]});
    renderMsgs();toast('Dropped to attach as a citation');
    return;
  }
  if(tabId){
    const t=TABS.find(x=>x.id===tabId);if(!t)return;
    if(!composerStack.find(p=>p.name===t.title.split(' ')[0])){composerStack.push({fav:t.fav,cls:t.favCls,name:t.title.split(' ')[0]});renderComposerStack();toast(`@${t.title.split(' ')[0]} added to chat`)}
  }
});
$('#dropOv').addEventListener('dragover',ev=>ev.preventDefault());

/* keyboard */
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='l'){e.preventDefault();$('#urlbar').click()}
  if((e.metaKey||e.ctrlKey)&&e.key==='t'){e.preventDefault();addNewTab('ntp')}
  if((e.metaKey||e.ctrlKey)&&e.key===','){e.preventDefault();openOrSelect('settings')}
  if((e.metaKey||e.ctrlKey)&&e.key==='.'){e.preventDefault();$('#chatBtn').click()}
  // ⌘1..5 spaces
  if((e.metaKey||e.ctrlKey)&&/^[1-5]$/.test(e.key)){e.preventDefault();const sp=SPACES[+e.key-1];if(sp){activeSpace=sp.id;renderSpace();renderSpacesPop()}}
});

/* INIT */
renderSpacesPop();renderSpace();renderTabs();renderPage();renderUrl();renderMsgs();renderComposerStack();
</script>
</body>
</html>
